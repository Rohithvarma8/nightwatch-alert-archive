name: Record NWS alerts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record alerts
        env:
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
        run: python record.py

      - name: Commit and push changes
        run: |
          git config user.name "nightwatch-recorder"
          git config user.email "nightwatch-recorder@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "No new alerts"
            exit 0
          fi
          git commit -m "Record NWS alerts $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
